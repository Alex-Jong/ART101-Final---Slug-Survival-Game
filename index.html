<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Slug Survival Game</title>
    <link href="SlugSurvival.css" rel="stylesheet" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="SlugSurvival.js" defer></script>
</head>

<body>
    
    <!--Beginning Page when starting the webpage-->
    <p id="thought">Maybe click on the Tv...</p>
    <div class="IntroPage">
        <button id="TvScreen"><img src="Tv.png"></button>
        <div><p id="answer"></p></div>
        <div class="CoverScreen">
            <img src="Introduction.png">
            <button id="continue">Continue</button>
        </div>
    </div>

    
    <!--This is the main content of the game, the choise part of it-->

    <!--Beginning Forest Scene Sign Buttons-->
    <div class="MidPage">
        <button id="LeftImg"><img src="MidSection1Left.png"></button>
        <button id="RightImg"><img src="MidSection1Right.png"></button>
    </div>

    <!--Lake Scene Buttons-->
    <div class="lake">
        <button id="LakeLeftImg"><img src="lakeSignLeft.png"></button>
        <button id="LakeRightImg"><img src="lakeSignRight.png"></button>
    </div>

    <!--Deeper Forest Scene Buttons-->
    <div class="forest">
        <button id="ForestLeftImg"><img src="ForestLeftImg.png"></button>
        <button id="ForestRightImg"><img src="ForestRightImg.png"></button>
    </div>

    <!--Cat Scene-->
    <div class="cat">
        <div id="catTitle"><h1>Arriving at Cat's Cradle</h1></div>
        <div id="Slug"><img src="SlugConfused.png"></div>
        <div id="CatPortrait"><img src="CatNormal.png"></div>
        <div id="catAnswer">
            <div id="catAnswer1">
                <button></button>
            </div>
        </div>
    </div>

    <!--Barrel Scene-->
    <div class="barrel">
        <button id="BarrelDoor"><img src="BarrelDoor.png"></button>
    </div>

    <!--Backrooms Enterance Scene-->
    <div class="barrelAsk">
        <button id="CattyButton"><img src="CatsMover.PNG"></button>
        <div id="Slug2"><img src="SlugConfused.png"></div>
        <div id="BackroomsDialog"><button></button></div>
    </div>

    <!--Continue Down River Scene-->
    <div class="downRiver">
        <button id="RiverUp"><img src="DownRiverUp.png"></button>
        <button id="RiverContinue"><img src="DownRiverContinue.png"></button>
    </div>

    <!--Poolrooms Scene-->
    <div class="Riverfall">
        <div><button id="RiverFalldialog"></button></div>
        <button id="PoolButton"><img src="PoolRoomSign.png"></button>
    </div>

    <!--Bannana Joes Scene-->
    <div class="BannanaJoes">
        <div><button id="bannanajoesDialog"></button></div>
    </div>

    <!--Merill Market Scene-->
    <div class="Merillmarket">
        <div><button id="Merilldialog"></button></div>
    </div>

    <!--Food Room Scene-->
    <div class="FoodCharacters">
        <button id="burger"><img src="BurgerNormal.png"></button>
        <button id="coffee"><img src="CoffeeNormal.png"></button>
        <div id="bread"><img src="Bread_Asset.png"></div>
        <div id="ham"><img src="ham.png"></div>
        <div id="cheese"><img src="cheese.PNG"></div>
        <div id="bannana"><img src="Bannana.png"></div>
        <button id="shelf"><img src="shelf.png"></button>
        <div><button id="FoodRoomDialog"></button></div>
        <p id="Breadthought">$3</p>
        <p id="Hamthought">$55</p>
        <p id="Cheesethought">$5</p>
        <p id="Bannanathought">$4</p>
        <p id="Burgerthought">So did you find the price? Click on my portrait if you found out</p>
        <p id="Coffeethought">So did you find the price? Click on my portrait if you found out</p>
        <button id="back"><img src="back.PNG"></button>
        <button id="backing"><img src="BackToCatRoom.png"></button>
    </div>

    <!--Doors in Cat Room Scene-->
    <div class="FoodRoomsDoor">
        <div id="exit"><img src="ExitDoor.png"></div>
        <div id="FoodDoor"><img src="FoodRoomSign.png"></div>
    </div>

    <!--Merill Buttons-->
    <div class="merill">
        <button id="explore"><img src="MerillMarketExplore.png"></button>
        <button id="enter"><img src="MerillMarketHead.png"></button>
    </div>

    <!--Endings-->
    <div class="Ending">
        <button id="GoodEnding"></button>
        <button id="BadEnding"></button>
        <div id="exit1"><img src="ExitDoor.png"></div>
        <div id="FoodDoor1"><img src="FoodRoomSign.png"></div>
    </div>

    <!--Preloading Backgrounds-->
    <div id="noshow">
        <img src="MidSection1.png">
        <img src="forest.png">
        <img src="barrels.png">
        <img src="barrels.png">
        <img src="Backrooms.png">
        <img src="cats.png">
        <img src="lake.png">    
        <img src="DownRiver.png">
        <img src="MerillMarket.png">
        <img src="BannanaJoes.png">
        <img src="RiverRoom.jpg">
        <img src="ContinueDownRiver.png">
        <img src="CatRoom.png">
        <img src="RiverRoom.png">
        <img src="shelf.jpg">
        <img src="FoodRoom.png">
        <img src="BlackScreen.avif">
        <img src="GoodEnding.png">
        <img src="BadEnding.png">
    </div>
</body>
</html>
